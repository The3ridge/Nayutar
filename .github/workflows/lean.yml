name: Lean

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lean:
    name: Lean specification (lake build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Check protected theorems are declared
        run: |
          set -euo pipefail
          go build -o "${RUNNER_TEMP}/check-protected-theorems" ./cmd/check-protected-theorems
          "${RUNNER_TEMP}/check-protected-theorems"

      - name: Install Elan
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          set -euo pipefail
          archive="elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/${archive}"
          echo "${ELAN_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/elan-init" -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Build the Lean specification
        working-directory: spec
        run: |
          set -euo pipefail
          lake --version
          lake build

      - name: Install bubblewrap
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends bubblewrap
          fi
          command -v bwrap
          bwrap --version

      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true

      - name: Check theorem statements and axioms
        working-directory: spec
        run: lake comparator

      - name: Reject a missing theorem, weakened statements, sorry, and extra axioms
        run: bash scripts/tests/test-comparator-rejections.sh
