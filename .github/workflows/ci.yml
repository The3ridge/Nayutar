name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow-security:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and run zizmor
        env:
          ZIZMOR_VERSION: v1.31.1
          ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
        run: |
          set -euo pipefail
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/${ZIZMOR_VERSION}/${archive}"
          echo "${ZIZMOR_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/zizmor" --pedantic --strict-collection --offline .

  decisions:
    name: Decision records (docdag)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install docdag
        run: go install github.com/Kaikei-e/DocDag/cmd/docdag@v0.6.0

      - name: Validate and lint the ADR graph
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            docdag validate --format github --immutable-since "origin/${GITHUB_BASE_REF}"
          elif [ "${EVENT_NAME}" = "push" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null; then
            docdag validate --format github --immutable-since "${BEFORE_SHA}"
          else
            docdag validate --format github
          fi
          docdag lint --strict

  agent-harness:
    name: Agent harness (guards and self-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run agent harness tests
        run: python3 scripts/tests/test-agent-harness.py

      - name: Run agent harness self-check
        run: python3 scripts/agent-harness/harness_selfcheck.py

  lkal:
    name: LKAL documents (lkal)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install lkal
        run: go install github.com/Kaikei-e/LKAL/cmd/lkal@v0.2.0

      - name: Check, format-check and schema-check every .lkal file
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.lkal')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no .lkal files"
            exit 0
          fi
          lkal check "${files[@]}"
          unformatted=$(lkal fmt -l "${files[@]}")
          if [ -n "${unformatted}" ]; then
            printf 'not in canonical form (run lkal fmt -w):\n%s\n' "${unformatted}"
            exit 1
          fi
          mapfile -t schemas < <(git ls-files '*.schema.lkal')
          if [ "${#schemas[@]}" -eq 0 ]; then
            echo "no .schema.lkal files"
            exit 1
          fi
          lkal schema check "${schemas[@]}"
          for schema_file in "${schemas[@]}"; do
            paired="${schema_file%.schema.lkal}.lkal"
            if [ -f "${paired}" ]; then
              lkal check --schema "${schema_file}" "${paired}"
            fi
          done

      - name: Decode the development etcd declaration
        run: |
          set -euo pipefail
          go test -count=1 -v -run '^TestDevDeclarationDecodes$' ./cmd/dev-etcd | tee "${RUNNER_TEMP}/dev-declaration.log"
          grep -q '^--- PASS: TestDevDeclarationDecodes' "${RUNNER_TEMP}/dev-declaration.log"

  go:
    name: Go core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 1.27.3 is the floor. "1.27" tracks the newest patch of that major.
        # Add a newer major while it is still inside Go's two-release support
        # window and at least 1.27.3, and drop a major once it falls out.
        go-version:
          - "1.27.3"
          - "1.27"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Check gofmt
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.go')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no .go files"
            exit 1
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "${unformatted}" ]; then
            printf 'not gofmt-clean:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

  store-etcd:
    name: Store contract on etcd
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Vet store, liveness, resource and wire packages with etcd tag
        run: go vet -tags etcd ./core/store/... ./core/liveness/... ./core/resource/... ./core/wire/...

      - name: Install etcd
        env:
          ETCD_VERSION: v3.6.16
          ETCD_SHA256: c8c0d96d8292ef085deabbf735e9561d3d396768e4d606df005aa25964f21911
        run: |
          set -euo pipefail
          archive="etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/${archive}"
          echo "${ETCD_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/etcd"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/etcd" --strip-components=1
          "${RUNNER_TEMP}/etcd/etcd" --version

      - name: Run the store contract, linearizability checks, node registry, resource objects and wire handler against etcd
        env:
          NAYUTAR_ETCD_BIN: ${{ runner.temp }}/etcd/etcd
        run: go test -count=1 -tags etcd ./core/store/... ./core/liveness/ ./core/resource/ ./core/wire/

      - name: Run the store contract, linearizability checks, node registry, resource objects and wire handler against etcd with race detector
        env:
          NAYUTAR_ETCD_BIN: ${{ runner.temp }}/etcd/etcd
        run: go test -race -count=1 -tags etcd ./core/store/... ./core/liveness/ ./core/resource/ ./core/wire/

  node-containerd:
    name: Direct containerd execution (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Vet node package with containerd tag
        run: go vet -tags containerd ./core/node/...

      - name: Install containerd, runc and CNI plugins
        env:
          CONTAINERD_VERSION: 2.3.7
          CONTAINERD_SHA256: 09a1b669ac6d21e7e24c3c33a9805b48987ba5845e8d88f039c47013a0c0025c
          RUNC_VERSION: v1.5.2
          RUNC_SHA256: 599f6f94ff8c5057241eff0d54c3c74f95c34935b6457b33fe545defc61e9488
          CNI_PLUGINS_VERSION: v1.9.0
          CNI_PLUGINS_SHA256: 58c03705426e929658f45a851df15a86d06ef680cacbf3f2dc127731ca265c28
        run: |
          set -euo pipefail
          ctrd_archive="containerd-${CONTAINERD_VERSION}-linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/${ctrd_archive}" \
            "https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/${ctrd_archive}"
          echo "${CONTAINERD_SHA256}  ${RUNNER_TEMP}/${ctrd_archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/runtime"
          tar -xzf "${RUNNER_TEMP}/${ctrd_archive}" -C "${RUNNER_TEMP}/runtime"

          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/runtime/bin/runc" \
            "https://github.com/opencontainers/runc/releases/download/${RUNC_VERSION}/runc.amd64"
          echo "${RUNC_SHA256}  ${RUNNER_TEMP}/runtime/bin/runc" | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/runtime/bin/runc"

          cni_archive="cni-plugins-linux-amd64-${CNI_PLUGINS_VERSION}.tgz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/${cni_archive}" \
            "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/${cni_archive}"
          echo "${CNI_PLUGINS_SHA256}  ${RUNNER_TEMP}/${cni_archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/cni/bin"
          tar -xzf "${RUNNER_TEMP}/${cni_archive}" -C "${RUNNER_TEMP}/cni/bin"

          "${RUNNER_TEMP}/runtime/bin/containerd" --version
          "${RUNNER_TEMP}/runtime/bin/runc" --version

      - name: Run the direct containerd, netns and CNI integration suite with and without race detector
        run: |
          set -euo pipefail
          run_dir="${RUNNER_TEMP}/containerd-run"
          mkdir -p "${run_dir}/root" "${run_dir}/state"
          sock="${run_dir}/containerd.sock"
          sudo env "PATH=${RUNNER_TEMP}/runtime/bin:${PATH}" \
            "${RUNNER_TEMP}/runtime/bin/containerd" \
            --root "${run_dir}/root" \
            --state "${run_dir}/state" \
            --address "${sock}" >"${run_dir}/containerd.log" 2>&1 &
          ctrd_pid=$!
          cleanup() {
            sudo kill -TERM "${ctrd_pid}" 2>/dev/null
            wait "${ctrd_pid}" 2>/dev/null
          }
          trap 'set +e; cleanup' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if sudo "${RUNNER_TEMP}/runtime/bin/ctr" --address "${sock}" version >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "${ready}" -ne 1 ]; then
            cat "${run_dir}/containerd.log" >&2
            exit 1
          fi
          sudo env \
            "PATH=${RUNNER_TEMP}/runtime/bin:${PATH}" \
            "HOME=${HOME}" \
            "GOCACHE=${RUNNER_TEMP}/go-build" \
            "NAYUTAR_CONTAINERD_SOCK=${sock}" \
            "NAYUTAR_CNI_BIN_DIR=${RUNNER_TEMP}/cni/bin" \
            go test -count=1 -tags containerd ./core/node/...
          sudo env \
            "PATH=${RUNNER_TEMP}/runtime/bin:${PATH}" \
            "HOME=${HOME}" \
            "GOCACHE=${RUNNER_TEMP}/go-build" \
            "NAYUTAR_CONTAINERD_SOCK=${sock}" \
            "NAYUTAR_CNI_BIN_DIR=${RUNNER_TEMP}/cni/bin" \
            go test -race -count=1 -tags containerd ./core/node/...

  netpol-nftables:
    name: Default-deny network policy (nftables)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Vet netpol package with nftables tag
        run: go vet -tags nftables ./core/netpol/...

      - name: Install nftables, iproute2 and CNI plugins
        env:
          CNI_PLUGINS_VERSION: v1.9.0
          CNI_PLUGINS_SHA256: 58c03705426e929658f45a851df15a86d06ef680cacbf3f2dc127731ca265c28
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2

          cni_archive="cni-plugins-linux-amd64-${CNI_PLUGINS_VERSION}.tgz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/${cni_archive}" \
            "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/${cni_archive}"
          echo "${CNI_PLUGINS_SHA256}  ${RUNNER_TEMP}/${cni_archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/cni/bin"
          tar -xzf "${RUNNER_TEMP}/${cni_archive}" -C "${RUNNER_TEMP}/cni/bin"
          nft --version

      - name: Run the real nftables and per-tenant bridge integration suite with and without race detector
        run: |
          set -euo pipefail
          nft_bin="$(command -v nft)"
          sudo env \
            "PATH=${PATH}" \
            "HOME=${HOME}" \
            "GOCACHE=${RUNNER_TEMP}/go-build" \
            "NAYUTAR_CNI_BIN_DIR=${RUNNER_TEMP}/cni/bin" \
            "NAYUTAR_NFT_BIN=${nft_bin}" \
            go test -count=1 -tags nftables ./core/netpol/...
          sudo env \
            "PATH=${PATH}" \
            "HOME=${HOME}" \
            "GOCACHE=${RUNNER_TEMP}/go-build" \
            "NAYUTAR_CNI_BIN_DIR=${RUNNER_TEMP}/cni/bin" \
            "NAYUTAR_NFT_BIN=${nft_bin}" \
            go test -race -count=1 -tags nftables ./core/netpol/...

  vulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Standard-library findings are fixed by the toolchain, not by go.mod, so scan with the newest 1.27 patch release.
          go-version: "1.27"
          check-latest: true
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      # govulncheck fails the job only for vulnerabilities reachable from this module's code (default symbol-level scan); uncalled module-level findings are printed but do not fail.
      - name: Scan the module and its tests
        run: govulncheck -test ./...

      - name: Scan the module and its tests with the drt and etcd build tags
        run: govulncheck -test -tags drt,etcd ./...

      - name: Scan the module and its tests with the containerd and nftables build tags
        run: govulncheck -test -tags drt,etcd,containerd,nftables ./...
